# Retail Store On-Premises Inventory
# Replace placeholder IPs and usernames with your actual node addresses.

[master]
# Primary Kubernetes control-plane node
# 192.168.1.10 ansible_user=ubuntu

[workers]
# Kubernetes worker nodes (add one line per node)
# 192.168.1.11 ansible_user=ubuntu
# 192.168.1.12 ansible_user=ubuntu

[registry]
# Node that will host the local Docker Registry v2
# 192.168.1.50 ansible_user=ubuntu

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
