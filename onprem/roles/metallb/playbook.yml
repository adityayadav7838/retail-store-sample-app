---
# Entry-point playbook for the metallb role.
# Imported by onprem/site.yml after the local-registry role.
#
# All kubectl/helm commands run on the Ansible control node (localhost)
# which is expected to have a valid kubeconfig for the on-prem cluster.
- name: Install MetalLB bare-metal load balancer
  hosts: localhost
  gather_facts: false
  roles:
    - role: metallb
