---
# =============================================================================
# k8s-cluster/tasks/kubeadm.yml
# Full multi-node cluster using kubeadm.
# Flow: install containerd → install kube tools → kubeadm init on master →
#       generate join command → join workers → install Flannel CNI
# Requirements: 1.1, 1.2, 1.5
# =============================================================================

# ---------------------------------------------------------------------------
# 1. System prerequisites (all nodes)
# ---------------------------------------------------------------------------
- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Configure sysctl for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables",  value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward",                 value: "1" }

- name: Disable swap (kubeadm requirement)
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap entry from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

# ---------------------------------------------------------------------------
# 2. Install containerd (all nodes)
# ---------------------------------------------------------------------------
- name: Install containerd dependencies (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Add Docker GPG key (Debian/Ubuntu)
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  when: ansible_os_family == "Debian"

- name: Add Docker apt repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: ansible_os_family == "Debian"

- name: Install containerd (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "containerd.io"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install containerd dependencies (RHEL/CentOS)
  ansible.builtin.yum:
    name:
      - yum-utils
    state: present
  when: ansible_os_family == "RedHat"

- name: Add Docker yum repository (RHEL/CentOS)
  ansible.builtin.command: >
    yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo
  when: ansible_os_family == "RedHat"

- name: Install containerd (RHEL/CentOS)
  ansible.builtin.yum:
    name: containerd.io
    state: present
  when: ansible_os_family == "RedHat"

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate default containerd config
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Enable SystemdCgroup in containerd config
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
    daemon_reload: true

# ---------------------------------------------------------------------------
# 3. Install kubelet, kubeadm, kubectl at pinned version (all nodes)
# ---------------------------------------------------------------------------
- name: Add Kubernetes apt signing key (Debian/Ubuntu)
  ansible.builtin.apt_key:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
    state: present
  when: ansible_os_family == "Debian"

- name: Add Kubernetes apt repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
    state: present
    filename: kubernetes
  when: ansible_os_family == "Debian"

- name: Install kubelet, kubeadm, kubectl (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version }}.*"
      - "kubeadm={{ k8s_version }}.*"
      - "kubectl={{ k8s_version }}.*"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Hold kubelet, kubeadm, kubectl at installed version (Debian/Ubuntu)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  when: ansible_os_family == "Debian"

- name: Add Kubernetes yum repository (RHEL/CentOS)
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/"
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/repodata/repomd.xml.key"
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Install kubelet, kubeadm, kubectl (RHEL/CentOS)
  ansible.builtin.yum:
    name:
      - "kubelet-{{ k8s_version }}"
      - "kubeadm-{{ k8s_version }}"
      - "kubectl-{{ k8s_version }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true

# ---------------------------------------------------------------------------
# 4. Initialize control plane on master node (kubeadm init)
# ---------------------------------------------------------------------------
- name: Check if kubeadm has already initialized the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: _kubeadm_init_done
  when: inventory_hostname in groups['master']

- name: Run kubeadm init on master node
  ansible.builtin.command: >
    kubeadm init
    --kubernetes-version={{ k8s_version }}
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
  when:
    - inventory_hostname in groups['master']
    - not _kubeadm_init_done.stat.exists
  register: _kubeadm_init_output

- name: Create .kube directory for root user on master
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"
  when: inventory_hostname in groups['master']

- name: Copy admin.conf to root's kubeconfig on master
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"
  when: inventory_hostname in groups['master']

# ---------------------------------------------------------------------------
# 5. Copy kubeconfig to Ansible control node
# ---------------------------------------------------------------------------
- name: Fetch kubeconfig from master to control node
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: true
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Set permissions on local kubeconfig
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: "0600"
  delegate_to: localhost
  run_once: true

# ---------------------------------------------------------------------------
# 6. Install Flannel CNI on master (requirement 1.5)
# ---------------------------------------------------------------------------
- name: Apply Flannel CNI manifest
  ansible.builtin.command: >
    kubectl apply -f
    https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  changed_when: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: inventory_hostname in groups['master']

- name: Wait for Flannel pods to be Running
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pod
    -l app=flannel
    -n kube-flannel
    --timeout=120s
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: inventory_hostname in groups['master']

# ---------------------------------------------------------------------------
# 7. Generate worker join command and join each worker node
# ---------------------------------------------------------------------------
- name: Generate kubeadm join command on master
  ansible.builtin.command: kubeadm token create --print-join-command
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  changed_when: false
  register: _kubeadm_join_cmd
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Store join command as a fact
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ _kubeadm_join_cmd.stdout }}"
  run_once: true

- name: Check if worker node has already joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: _worker_joined
  when: inventory_hostname in groups['workers'] | default([])

- name: Join worker nodes to the cluster
  ansible.builtin.command: "{{ kubeadm_join_command }}"
  when:
    - inventory_hostname in groups['workers'] | default([])
    - not _worker_joined.stat.exists
