---
# Entry-point playbook for the nginx-ingress role.
# Imported by onprem/site.yml after the metallb role.
#
# All kubectl/helm commands run on the Ansible control node (localhost)
# which is expected to have a valid kubeconfig for the on-prem cluster.
- name: Install NGINX Ingress Controller
  hosts: localhost
  gather_facts: false
  roles:
    - role: nginx-ingress
