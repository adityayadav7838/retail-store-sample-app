apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: retail-store
  source:
    repoURL: https://github.com/adityayadav7838/retail-store-sample-app-through-ansible
    targetRevision: on-prem
    path: src/ui/chart
    helm:
      valueFiles:
        - values.yaml
        - values-onprem.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 
